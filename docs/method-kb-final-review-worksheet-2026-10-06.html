<script id="data" type="application/json">[{"idx": 1, "domain": "behavior", "slug": "activation-before-motivation", "title": "先行动，动机后到", "summary": "行为激活的核心：等有动力再动是死循环；先动，情绪与动机往往随后改善。", "tier": "A", "status": "verified", "verification": "verified", "source": "Clinical Psychology: Science and Practice / Clinical Psychology Review", "url": "https://www.sciencedirect.com/science/article/pii/S0272735826000929"}, {"idx": 2, "domain": "behavior", "slug": "behavioural-activation-first-step", "title": "行为激活：先动，再调整情绪", "summary": "情绪低落时先安排一件具体的小活动，而不是先解决心情——情绪常在行为之后改善。", "tier": "A", "status": "verified", "verification": "verified", "source": "Clinical Psychology: Science and Practice / Clinical Psychology Review", "url": "https://www.sciencedirect.com/science/article/pii/S0272735826000929"}, {"idx": 3, "domain": "behavior", "slug": "cue-reliability-check", "title": "选锚点前先做可靠性自查", "summary": "锚点必须「每天都发生」才算合格；偶尔发生的锚点挂不住习惯。", "tier": "C", "status": "verified", "verification": "practitioner", "source": "行为改变实践共识", "url": ""}, {"idx": 4, "domain": "behavior", "slug": "environment-design", "title": "环境设计：让好行为更容易、坏行为更麻烦", "summary": "改变环境比改变意志力省力：把手机放远、把书放近。", "tier": "C", "status": "verified", "verification": "canonical", "source": "行为科学综述", "url": ""}, {"idx": 5, "domain": "behavior", "slug": "first-step-ugly", "title": "先做最丑的那一步", "summary": "把任务中最容易让人退缩的部分放到最前面（打开文档、发出第一条消息）。", "tier": "C", "status": "verified", "verification": "practitioner", "source": "行为改变实践共识", "url": ""}, {"idx": 6, "domain": "behavior", "slug": "friction-and-variability", "title": "摩擦与「稳定性」的关系（部分争议）", "summary": "改变环境摩擦被认为能替代意志力；但「稳定性优势」的普遍性存在争论。", "tier": "C", "status": "verified", "verification": "canonical", "source": "行为科学综述", "url": "https://en.wikipedia.org/wiki/Choice_architecture"}, {"idx": 7, "domain": "behavior", "slug": "friction-for-bad-habits", "title": "反向摩擦：给坏行为加一步", "summary": "提高干扰行为的摩擦成本，比压制它更有效——把诱惑从顺手变成费事。", "tier": "C", "status": "verified", "verification": "canonical", "source": "行为科学综述", "url": "https://en.wikipedia.org/wiki/Nudge_theory"}, {"idx": 8, "domain": "behavior", "slug": "friction-reduction", "title": "削减摩擦：让好行为少一步", "summary": "改变环境比改变意志力省力——把需要的材料提前备好，让开始不需要额外决策。", "tier": "C", "status": "verified", "verification": "canonical", "source": "行为经济学与行为科学综述", "url": "https://en.wikipedia.org/wiki/Choice_architecture"}, {"idx": 9, "domain": "behavior", "slug": "habit-context-stability", "title": "情境稳定比次数更关键", "summary": "同一行为在固定情境下重复才容易自动化；换环境会显著削弱自动化程度。", "tier": "B", "status": "verified", "verification": "canonical", "source": "European Journal of Social Psychology / Healthcare", "url": "https://en.wikipedia.org/wiki/Habit"}, {"idx": 10, "domain": "behavior", "slug": "habit-cue-based-planning", "title": "情境化计划：把新习惯绑到具体作息节点", "summary": "把「我要每天跑 3 公里」改写成「如果晚饭后换好运动鞋，我就跑 3 公里」，可操作性与执行率都更高。", "tier": "B", "status": "verified", "verification": "canonical", "source": "行为改变实施研究", "url": ""}, {"idx": 11, "domain": "behavior", "slug": "habit-cue-based-vs-decision", "title": "靠线索触发，不靠每天重新决策", "summary": "把行为绑定到情境线索上，能减少每次都要「决定要不要做」的消耗。", "tier": "B", "status": "verified", "verification": "canonical", "source": "行为科学综述", "url": "https://en.wikipedia.org/wiki/Habit"}, {"idx": 12, "domain": "behavior", "slug": "habit-cue-crease-budget", "title": "每次只留一个主线索", "summary": "给同一行为配置太多触发线索会造成互相干扰；一个主线索更容易形成稳定联结。", "tier": "C", "status": "verified", "verification": "practitioner", "source": "行为改变实践共识", "url": ""}, {"idx": 13, "domain": "behavior", "slug": "habit-cue-routine-reward", "title": "习惯三环：线索 → 行为 → 奖赏", "summary": "习惯不是靠重复次数堆出来的，而是靠「特定线索稳定触发了同一行为」。", "tier": "B", "status": "verified", "verification": "canonical", "source": "Perspectives on Psychological Science", "url": "https://en.wikipedia.org/wiki/Habituation"}, {"idx": 14, "domain": "behavior", "slug": "habit-formation-loop", "title": "习惯靠重复与稳定情境，而非意志力", "summary": "在固定情境里重复，行为会逐渐自动化；平均需要约 66 天，个体差异很大。坚持不下来多半不是意志力问题，是情境没固定。", "tier": "B", "status": "verified", "verification": "canonical", "source": "European Journal of Social Psychology", "url": "https://en.wikipedia.org/wiki/Habit_formation"}, {"idx": 15, "domain": "behavior", "slug": "habit-formation-times", "title": "养成一个习惯要多久：没有 21 天这回事", "summary": "习惯形成时间个体差异极大（研究中位数约 59-66 天，个体范围可到数月到一年）；用固定天数承诺或判失败都不准。", "tier": "A", "status": "verified", "verification": "canonical", "source": "European Journal of Social Psychology / Healthcare", "url": "https://pubmed.ncbi.nlm.nih.gov/21093373/"}, {"idx": 16, "domain": "behavior", "slug": "habit-instigation-vs-execution", "title": "启动自动化 ≠ 执行自动化", "summary": "复杂行为（健身、学习）往往先把「开始」自动化了，执行过程仍靠意志——这是很多人「习惯养成了但还是没做」的原因。", "tier": "B", "status": "verified", "verification": "verified", "source": "Social and Personality Psychology Compass, 18(6), e12975", "url": "https://doi.org/10.1111/spc3.12975"}, {"idx": 17, "domain": "behavior", "slug": "habit-maintenance-after-success", "title": "达标后为何反而不做了：奖励点重置", "summary": "到达一个奖励点后动力会明显回落（拿到免费咖啡后购买频率骤降），随后重新累积——这是常见「刚成功就停摆」的原因。", "tier": "B", "status": "verified", "verification": "verified", "source": "Journal of Marketing Research, Vol. XLIII (Feb), 39-58", "url": "https://business.columbia.edu/faculty/research/goal-gradient-hypothesis-resurrected-purchase-acceleration-illusionary-goal"}, {"idx": 18, "domain": "behavior", "slug": "habit-measure-consistency", "title": "看「一致性」而不是「完美度」", "summary": "长期效果更取决于行为在时间轴上的分布是否稳定，而非某几天是否满分。", "tier": "B", "status": "verified", "verification": "canonical", "source": "Healthcare（2024 系统综述）/ 纵向研究", "url": "https://www.bps.org.uk/psychologist/new-year-resolutions-what-makes-them-stick"}, {"idx": 19, "domain": "behavior", "slug": "habit-missing-one-day", "title": "漏一天不会前功尽弃", "summary": "已经中断之后不必重头再来：错过一次对自动化轨迹没有可测量的影响，恢复的关键是尽快回到原来的线索，而不是把损失补回来。", "tier": "B", "status": "verified", "verification": "canonical", "source": "European Journal of Social Psychology", "url": "https://en.wikipedia.org/wiki/Habit"}, {"idx": 20, "domain": "behavior", "slug": "habit-relapse-protocol", "title": "中断处理协议：立刻重排，不是重启", "summary": "正确的中断处理是把下一次执行排进日程，越快越好；把「重启仪式」当成启动门槛反而是二次阻力。", "tier": "C", "status": "verified", "verification": "canonical", "source": "行为改变实践共识", "url": ""}, {"idx": 21, "domain": "behavior", "slug": "habit-research-selfcritique", "title": "⚠️ 习惯研究自我批评：领域内部争论", "summary": "习惯研究的前沿研究者自己指出：习惯形成在真实复杂行为中可能被高估，且既非必要也非充分条件。", "tier": "B", "status": "contested", "verification": "verified", "source": "Social and Personality Psychology Compass, 18(6), e12975", "url": "https://doi.org/10.1111/spc3.12975"}, {"idx": 22, "domain": "behavior", "slug": "habit-stack-overload", "title": "同时改多个习惯，几乎必失败", "summary": "并行改多个新习惯会分散线索与注意力，导致每个都难以自动化。", "tier": "C", "status": "verified", "verification": "practitioner", "source": "行为改变实践共识", "url": ""}, {"idx": 23, "domain": "behavior", "slug": "habit-stacking-anchor", "title": "习惯叠加：把新行为挂在旧习惯后面", "summary": "与其凭空造一个新习惯，不如把它接在已经稳定的动作后面。", "tier": "B", "status": "verified", "verification": "practitioner", "source": "实践方法（机制有行为科学支撑）", "url": ""}, {"idx": 24, "domain": "behavior", "slug": "habit-strength-vs-effort", "title": "习惯强度 ≠ 当下需要的努力", "summary": "习惯自动化程度与执行该行为所需的当下努力是两件事；高自动化行为仍可在疲劳时失败。", "tier": "B", "status": "verified", "verification": "verified", "source": "Social and Personality Psychology Compass, 18(6), e12975", "url": "https://doi.org/10.1111/spc3.12975"}, {"idx": 25, "domain": "behavior", "slug": "habit-tracking-minimal", "title": "追踪要轻到不成为负担", "summary": "记录的目的是给你反馈，不是打卡排名；记录成本一旦超过行为本身，追踪就会变成新的阻力。", "tier": "C", "status": "verified", "verification": "practitioner", "source": "行为改变实践共识", "url": ""}, {"idx": 26, "domain": "behavior", "slug": "habit-two-week-regression", "title": "早期反复是正常轨迹，不是失败信号", "summary": "自动化形成前必然反复波动；早期表现不稳定是过程的一部分。", "tier": "B", "status": "verified", "verification": "canonical", "source": "European Journal of Social Psychology", "url": "https://en.wikipedia.org/wiki/Habit"}, {"idx": 27, "domain": "behavior", "slug": "implement-if-then-obstacle", "title": "针对障碍写 if-then，而不是针对目标写", "summary": "WOOP 的第四步：障碍必须是**内在的**（我的犹豫/完美主义），然后为它写一条 if-then。", "tier": "A", "status": "verified", "verification": "verified", "source": "Frontiers in Psychology, 12, 565202", "url": "https://doi.org/10.3389/fpsyg.2021.565202"}, {"idx": 28, "domain": "behavior", "slug": "implementation-cue-spec", "title": "把「何时何地」写死：触发规格", "summary": "明确到具体时间、地点、动作的计划，执行率显著高于只写意图——这是全库证据最强的一条。", "tier": "A", "status": "verified", "verification": "verified", "source": "Advances in Experimental Social Psychology, 38, 69-119", "url": "https://doi.org/10.1016/S0065-2601(06)38002-1"}, {"idx": 29, "domain": "behavior", "slug": "implementation-intention-fatigue", "title": "旧计划会失效，要随情境更新", "summary": "if-then 计划绑定的是特定情境；情境变了之后机械执行旧计划反而是阻碍。", "tier": "B", "status": "verified", "verification": "canonical", "source": "Advances in Experimental Social Psychology, 38, 69-119", "url": "https://doi.org/10.1016/S0065-2601(06)38002-1"}, {"idx": 30, "domain": "behavior", "slug": "implementation-intentions", "title": "实施意图：如果…就…比「我要努力」管用", "summary": "把计划写成具体的 if-then（何时何地做什么），执行率显著提高。", "tier": "B", "status": "verified", "verification": "verified", "source": "Advances in Experimental Social Psychology", "url": "https://en.wikipedia.org/wiki/Implementation_intention"}, {"idx": 31, "domain": "behavior", "slug": "implementation-vs-goal-intent", "title": "目标意图 vs 实施意图：为什么「我一定要」没用", "summary": "「我要完成X」只是目标意图，不指定时机；实施意图补上「何时何地」，才是把意图变行动的那一步。", "tier": "A", "status": "verified", "verification": "verified", "source": "American Psychologist / Advances in Experimental Social Psychology", "url": "https://en.wikipedia.org/wiki/Implementation_intention"}, {"idx": 32, "domain": "behavior", "slug": "interrupt-batch-handling", "title": "碎片事务批量处理", "summary": "把回消息、填表这类碎片事务集中到固定时段，减少切换次数。", "tier": "D", "status": "verified", "verification": "practitioner", "source": "实践方法", "url": ""}, {"idx": 33, "domain": "behavior", "slug": "micro-habit-start", "title": "微习惯：把门槛降到不可能拒绝", "summary": "启动阻力主要来自「动作太大」，把动作缩到不可能失败的程度，先解决开始。", "tier": "C", "status": "verified", "verification": "practitioner", "source": "实践方法（机制有实证支撑）", "url": "https://en.wikipedia.org/wiki/Microhabits"}, {"idx": 34, "domain": "behavior", "slug": "minimum-action-floor", "title": "最小行动下限：再差也做这一步", "summary": "在能量极低的日子，仍执行一个预定义的最小动作，以维持线索与自动化不被清零。", "tier": "C", "status": "verified", "verification": "canonical", "source": "行为改变实践共识", "url": ""}, {"idx": 35, "domain": "behavior", "slug": "task-ambiguity-fog", "title": "任务模糊是拖延的三大主因之一", "summary": "「不知道从哪下手」比任务本身更难——模糊任务引发的焦虑无法被意志力直接处理。", "tier": "B", "status": "verified", "verification": "verified", "source": "Social and Personality Psychology Compass, 7(2), 115-127", "url": "https://doi.org/10.1111/spc3.12011"}, {"idx": 36, "domain": "behavior", "slug": "task-aversion-reduction", "title": "降低任务厌恶感", "summary": "改变任务本身带来的感受，比对抗它更有效——加结构、减模糊、去评价威胁。", "tier": "A", "status": "verified", "verification": "canonical", "source": "Psychological Bulletin, 133(1), 65-94", "url": "https://doi.org/10.1037/0033-2909.133.1.65"}, {"idx": 37, "domain": "behavior", "slug": "task-timeline-friction", "title": "先写时间线，再执行", "summary": "把任务放进具体时段能消除「什么时候做」的临场决策，从而减少启动摩擦。", "tier": "C", "status": "verified", "verification": "practitioner", "source": "行为改变实践共识", "url": "https://en.wikipedia.org/wiki/Time_blocking"}, {"idx": 38, "domain": "behavior", "slug": "two-minute-start", "title": "两分钟启动法", "summary": "承诺只做两分钟——门槛低到启动不产生情绪，而启动本身就解决了大部分问题。", "tier": "C", "status": "verified", "verification": "practitioner", "source": "实践方法", "url": ""}, {"idx": 39, "domain": "cognitive", "slug": "attention-residue", "title": "注意力残留：切换有成本", "summary": "从任务 A 切到 B 之后，A 的未完成部分仍占用认知资源——这才是多任务的真实代价。", "tier": "B", "status": "verified", "verification": "canonical", "source": "Organizational Behavior and Human Decision Processes", "url": "https://doi.org/10.1016/j.obhdp.2009.04.002"}, {"idx": 40, "domain": "cognitive", "slug": "attention-residue-not-depletion", "title": "用「残留」而不是「耗竭」解释切换成本", "summary": "切换任务的代价主要来自未完成任务的持续占 B", "status": "verified", "verification": "verified", "source": "Journal of Marketing Research, 43, 39-58", "url": "https://business.columbia.edu/faculty/research/goal-gradient-hypothesis-resurrected-purchase-acceleration-illusionary-goal"}, {"idx": 102, "domain": "psych", "slug": "goal-importance-vs-feasibility", "title": "重要性 × 可行性四格", "summary": "把「重要」和「可行」分开评，才能区分「该做但要先补条件」与「该放弃」。", "tier": "C", "status": "verified", "verification": "practitioner", "source": "决策方法共识", "url": ""}, {"idx": 103, "domain": "psych", "slug": "goal-kill-criteria", "title": "预设放弃条件", "summary": "事先写下什么情况下该放弃或换方向，是对抗沉没成本最有效的手段。", "tier": "B", "status": "verified", "verification": "canonical", "source": "Organizational Behavior and Human Decision Processes", "url": "https://psycnet.apa.org/record/1986-03146-001"}, {"idx": 104, "domain": "psych", "slug": "goal-smart-critique", "title": "SMART 的局限与改良", "summary": "SMART 是有用的检查表，但不是好目标的充分条件——过度追求「可量化」会牺牲真正重要的目标。", "tier": "C", "status": "verified", "verification": "canonical", "source": "目标设定实践共识", "url": ""}, {"idx": 105, "domain": "psych", "slug": "goal-subgoal-shaping", "title": "越接近终点越想推：但这不是意志力刻度", "summary": "接近目标时动力上升是常见现象，但不能据此把低动力解释成「意志力用完了」。", "tier": "B", "status": "verified", "verification": "canonical", "source": "行为科学综合", "url": "https://www.thebehavioralscientist.com/glossary/goal-gradient"}, {"idx": 106, "domain": "psych", "slug": "goal-time-horizon", "title": "时间视界要分段：1-4 周 vs 1-4 年", "summary": "长期目标必须切成短视界执行；一年期目标无法产生心理对照需要的具体画面。", "tier": "B", "status": "verified", "verification": "canonical", "source": "动机研究综述", "url": "https://en.wikipedia.org/wiki/Implementation_intention"}, {"idx": 107, "domain": "psych", "slug": "growth-mindset", "title": "成长型思维：能力可增长（但别神化它）", "summary": "相信能力可通过努力提升，有助于面对挫折——但它的实际效应比流行说法小得多。", "tier": "C", "status": "contested", "verification": "canonical", "source": "Psychological Science", "url": "https://en.wikipedia.org/wiki/Mindset"}, {"idx": 108, "domain": "psych", "slug": "growth-mindset-smal 用的", "summary": "同样金额的钱在不同来源与用途下被心理上区别对待，这扭曲决策。", "tier": "A", "status": "verified", "verification": "canonical", "source": "Journal of Consumer Research / Journal of Behavioral Decision Making", "url": "https://en.wikipedia.org/wiki/Mental_accounting"}, {"idx": 115, "domain": "psych", "slug": "mental-counterfactual-failure", "title": "事前验尸：先假设已经失败，找原因", "summary": "在开始前假设「这事最后没成」，倒推原因，能提前暴露最可能被忽略的环节。", "tier": "B", "status": "verified", "verification": "canonical", "source": "决策方法（证据弱于 MCII）", "url": "https://en.wikipedia.org/wiki/Premortem_analysis"}, {"idx": 116, "domain": "psych", "slug": "okr-key-result", "title": "OKR 与关键结果的用法边界", "summary": "OKR 适合对齐方向与可验证结果，但学生个人长期目标不必强套——它容易变成指标游戏。", "tier": "C", "status": "verified", "verification": "practitioner", "source": "目标管理实践共识", "url": ""}, {"idx": 117, "domain": "psych", "slug": "past-mortem-template", "title": "事前验尸会议模板", "summary": "让团队假设项目已失败并列出原因，比事后追责更能暴露真实风险。", "tier": "D", "status": "verified", "verification": "practitioner", "source": "项目管理实践共识", "url": ""}, {"idx": 118, "domain": "psych", "slug": "perfectionism-procrastination", "title": "完美主义型拖延：怕不够好所以不开始", "summary": "把「做不好」等同于「失败」的人会宁愿不做；解法是降低单次任务的标准，而不是降低对自己的要求。", "tier": "B", "status": "verified", "verification": "verified", "source": "Social and Personality Psychology Compass / Learning and Individual Differences", "url": "https://doi.org/10.1111/spc3.12011"}, {"idx": 119, "domain": "psych", "slug": "planning-fallacy", "title": "规划谬误：几乎总是低估耗时", "summary": "人对自己的任务完成时间估计系统性偏乐观，且偏差不是随机的。", "tier": "A", "status": "verified", "verification": "canonical", "source": "The Journal of Forecasting", "url": "https://en.wikipedia.org/wiki/Planning_fallacy"}, {"idx": 120, "domain": "psych", "slug": "positive-visualisation-backfire", "title": "只做正向想象可能反而消解能量", "summary": "反复想象成功场景却不设想障碍，会让大脑把目标读作已达成，因而降低行动能量。", "tier": "A", "status": "verified", "verification": "canonical", "source": "动机研究综述", "url": "https://en.wikipedia.org/wiki/Implementation_intention"}, {"id  "slug": "reactance-resistance", "title": "心理抗拒：被要求反而更不做", "summary": "当行为被感知为外部强加时，人会产生恢复自由的冲动，从而做出相反行为。", "tier": "C", "status": "verified", "verification": "canonical", "source": "Academic Press", "url": "https://en.wikipedia.org/wiki/Reactance_(psychology)"}, {"idx": 128, "domain": "psych", "slug": "resilience-recovery", "title": "复原力：中断后恢复的速度", "summary": "复原力不是「从不崩溃」，而是**恢复所需时间**；衡量它比衡量强度更有用。", "tier": "C", "status": "verified", "verification": "canonical", "source": "发展与临床心理学综述", "url": "https://en.wikipedia.org/wiki/Resilience"}, {"idx": 129, "domain": "psych", "slug": "resource-conservation-personal", "title": "个人精力守恒（自我观察，非理论主张）", "summary": "把「不安排满」当作保护长期产出能力的策略——这是经验做法，不是已证实的理论。", "tier": "D", "status": "verified", "verification": "practitioner", "source": "实践观察（无实证主张）", "url": ""}, {"idx": 130, "domain": "psych", "slug": "retrospective-review-cadence", "title": "复盘要固定节奏，否则变成情绪宣泄", "summary": "复盘只有在「固定节奏 + 指向下一步动作」时才产生信息；没有节奏的复盘只是抒发感受。", "tier": "C", "status": "verified", "verification": "canonical", "source": "学习与团队实践共识", "url": ""}, {"idx": 131, "domain": "psych", "slug": "review-and-adjust-goal", "title": "目标要允许被修改", "summary": "坚持一个已证明无效的目标不是意志力，是沉没成本；定期复核目标本身是必要动作。", "tier": "C", "status": "verified", "verification": "canonical", "source": "决策方法共识", "url": ""}, {"idx": 132, "domain": "psych", "slug": "self-compassion-neff", "title": "自我慈悲优于自我批评", "summary": "面对失败时，善意加共通性的回应比严厉指责产生更好的自我调节结果。", "tier": "B", "status": "verified", "verification": "verified", "source": "Self and Identity / Personality and Individual Differences, 48(7), 803-808", "url": "https://doi.org/10.1016/j.paid.2010.01.029"}, {"idx": 133, "domain": "psych", "slug": "self-control-heterogeneity", "title": "自控能力存在稳定个体差异", "summary": "不同人在执行控制上的基线能力不同，但这不决定成败——策略与环境的作用更大。", "tier": "B", "status": "verified", "verification": "canonical", "source": "人格心理学综述 / 2024 习惯系统综述", "url": "https://www.bps.org.uk/psychologist/new-year-resolutions-what-makes-them-stick"}, {"idx": 134, "domain": "psych", "slug": "self-criticism-harms-execution", "title": "自我批评会损害后续执行", "summary": "失误后的自我批评提高压力与负面情绪，因而提高下一次拖延的概率——它是循环的加速器而非刹车。", "tier": "A", "status": "verified", "verification": "verified", "source": "Personality and Individual Differences, 48(7), 803-808", "url": "https://doi.org/10.1016/j.paid.2010.01.029"}, {"idx": 135, "domain": "psych", "slug": "self-determination-theory", "title": "自我决定论：自主、胜任、归属决定内在动机", "summary": "当学习满足「我自己选的、我做得到、有人一起」三条时，动机最稳。", "tier": "B", "status": "verified", "verification": "verified", "source": "American Psychologist / Springer", "url": "https://en.wikipedia.org/wiki/Self-determination_theory"}, {"idx": 136, "domain": "psych", "slug": "self-forgiveness-cycle-break", "title": "自我宽恕打断拖延循环", "summary": "拖延后自责会加重负面情绪，反而提高下次拖延概率；宽恕自己则降低下次拖延。", "tier": "B", "status": "verified", "verification": "verified", "source": "Personality and Individual Differences, 48(7), 803-808", "url": "https://doi.org/10.1016/j.paid.2010.01.029"}, {"idx": 137, "domain": "psych", "slug": "social-accountability", "title": "社会问责：被看见会改变行为", "summary": "有真实他人知晓与期待时，行为更容易被坚持；但只有真实问责有效，形式化的「打卡」效果弱。", "tier": "B", "status": "verified", "verification": "canonical", "source": "行为科学综述", "url": "https://doi.org/10.1016/S0065-2601(06)38002-1"}, {"idx": 138, "domain": "psych", "slug": "stress-performance", "title": "耶克斯-多德森定律：适度紧张最好，过度就崩", "summary": "唤醒水平太低（走神）或太高（慌）都不利于表现；中等偏高最优。", "tier": "C", "status": "verified", "verification": "canonical", "source": "Journal of Comparative Neurology and Psychology", "url": "https://en.wikipedia.org/wiki/Yerkes%E2%80%93Dodson_law"}, {"idx": 139, "domain": "psych", "slug": "stress-performance-inverse", "title": "压力与表现：中等最好，过高会崩", "summary": "唤醒水平太低会走神，太高会崩；倒U 关系成立，但最佳点随任务难度移动。", "tier": "B", "status": "verified", "verification": "canonical", "source": "Journal of Comparative and Physiological Psychology", "url": "https://en.wikipedia.org/wiki/Yerkes%E2%80%93Dodson_law"}, {"idx": 140, "domain": "psych", "slug": "stress-reappraisal", "title": "压力重评：换解释而不是换情境", "summary": "改变对压力事件的解读，可以降低其情绪损害；对无法改变的事尤其如此。", "tier": "B", "status": "verified", "verification": "canonical", "source": "情绪调节与压力研究综述", "url": "https://en.wikipedia.org/wiki/Cognitive_reappraisal"}, {"idx": 141, "domain": "psych", "slug": "sunk-cost-ignore-past", "title": "沉没成本该被忽略", "summary": "已经花掉的时间与努力不该影响「接下来该怎么做」的判断——但人几乎总是被它影响。", "tier": "B", "status": "verified", "verification": "canonical", "source": "Organizational Behavior and Human Decision Processes, 35, 124-140 / Journal of Consumer Research", "url": "https://psycnet.apa.org/record/1986-03146-001"}, {"idx": 142, "domain": "psych", "slug": "suppression-vs-reappraisal", "title": "情绪抑制 vs 认知重评", "summary": "压着情绪不让它出现，需要持续消耗且会削弱后续情绪反应；重新解释则成本低、效果更持久。", "tier": "B", "status": "verified", "verification": "canonical", "source": "Review of General Psychology / Perspectives on Psychological Science", "url": "https://en.wikipedia.org/wiki/Cognitive_reappraisal"}, {"idx": 143, "domain": "psych", "slug": "temptation-bundling", "title": "诱惑捆绑：把「想要」绑到「该做」", "summary": "把即时的快乐活动与延迟回报的行为绑在一起，能显著提高后者执行率——前提是两者能自然配对。", "tier": "B", "status": "verified", "verification": "verified", "source": "Journal of Marketing Research, 51(4)", "url": "https://knowledge.wharton.upenn.edu/?p=13759/"}, {"idx": 144, "domain": "psych", "slug": "temptation-self-control-strategy", "title": "诱惑应对策略清单", "summary": "对即时诱惑的有效应对集中在四类：提前规避、捆绑替代、事前承诺、事后记账。", "tier": "B", "status": "verified", "verification": "canonical", "source": "Perspectives on Psychological Science, 6(3), 267-277", "url": "https://en.wikipedia.org/wiki/Self-control"}, {"idx": 145, "domain": "psych", "slug": "test-anxiety-cognitive-only", "title": "认知干预 vs 技能干预：差别不小", "summary": "只改想法不如同时练技能——认知与行为结合的方案效应最大。", "tier": "A", "status": "verified", "verification": "canonical", "source": "Journal of Consulting and Clinical Psychology / School Psychology International", "url": "https://researchonline.ljmu.ac.uk/id/eprint/14773/"}, {"idx": 146, "domain": "psych", "slug": "test-anxiety-intervention", "title": "考试焦虑：干预有效，别硬扛", "summary": "考试焦虑有实证支持的干预方式，效果可达中等以上；持续困扰时优先求助而非自我调节。", "tier": "A", "status": "verified", "verification": "canonical", "source": "Journal of Consulting and Clinical Psychology / School Psychology International", "url": "https://www.researchgate.net/publication/25140904_The_Efficacy_of_Interventions_for_Test_Anxiety_in_University_Students"}, {"idx": 147, "domain": "psych", "slug": "test-anxiety-skill-vs-cbt", "title": "考试焦虑干预：技能 vs 认知的分歧", "summary": "技能型干预（结合行为与学习技能）效应最大，纯认知行为干预效应最小——但两者都有效。", "tier": "A", "status": "verified", "verification": "canonical", "source": "Journal of Consulting and Clinical Psychology / School Psychology International", "url": "https://researchonline.ljmu.ac.uk/id/eprint/14773/"}, {"idx": 148, "domain": "psych", "slug": "when-to-seek-help", "title": "🔴 何时该找专业帮助（守门条目）", "summary": "自我调节方法有边界；持续的情绪困扰需要专业支持而不是更强的自我攻略。", "tier": "A", "status": "verified", "verification": "canonical", "source": "心理健康服务通识（依据各地心理健康服务体系）", "url": "https://en.wikipedia.org/wiki/Mental_health"}, {"idx": 149, "domain": "psych", "slug": "wills-power-model-avoid", "title": "别用「意志力有限」解释一切", "summary": "把失败归因于意志力资源耗尽，是一个未获预注册复制支持的解释；改用动机与环境更可操作。", "tier": "A", "status": "contested", "verification": "verified", "source": "Psychological Science, 32(10), 1566-1581", "url": "https://pubmed.ncbi.nlm.nih.gov/34520296/"}, {"idx": 150, "domain": "psych", "slug": "woop-mental-contrasting", "title": "WOOP：愿望—结果—障碍—计划", "summary": "先想清障碍再写 if-then，比只做正向激励想象更有效——纯正向想象有时会**降低**能量。", "tier": "A", "status": "verified", "verification": "verified", "source": "Frontiers in Psychology, 12, 565202", "url": "https://doi.org/10.3389/fpsyg.2021.565202"}, {"idx": 151, "domain": "study_skill", "slug": "cornell-notes", "title": "康奈尔笔记：一页分栏，逼出主动加工", "summary": "把笔记页分成线索、笔记、总结三栏，复习时遮住笔记用线索自我提问。", "tier": "D", "status": "verified", "verification": "practitioner", "source": "大学学习中心资料", "url": ""}, {"idx": 152, "domain": "study_skill", "slug": "deep-work", "title": "深度工作：一段无人打扰的高强度专注", "summary": "同样 2 小时，无干扰的深度工作产出远高于随时被打断的状态。", "tier": "D", "status": "verified", "verification": "practitioner", "source": "Grand Central Publishing", "url": ""}, {"idx": 153, "domain": "study_skill", "slug": "eisenhower-matrix", "title": "四象限：先分轻重缓急，再动手", "summary": "按重要、紧急两维把任务分类，避免被紧急但不重要的事淹没。", "tier": "D", "status": "verified", "verification": "practitioner", "source": "从业者/管理方法", "url": ""}, {"idx": 154, "domain": "study_skill", "slug": "feynman-technique", "title": "费曼技巧：讲给外行听，卡住处就是漏洞", "summary": "用自己的话把概念讲到外行能懂，讲不通的地方就是你其实没懂的地方。", "tier": "D", "status": "verified", "verification": "practitioner", "source": "普及方法（机制有综述支撑）", "url": ""}, {"idx": 155, "domain": "study_skill", "slug": "note-taking-active", "title": "笔记要加工不要搬运", "summary": "抄板书是低效的；把笔记写成自己的话、问题与联系才有价值。", "tier": "C", "status": "verified", "verification": "canonical", "source": "学习科学综述", "url": ""}, {"idx": 156, "domain": "study_skill", "slug": "pomodoro", "title": "番茄工作法：25 分钟专注 + 5 分钟休息", "summary": "把长任务切成短专注单元，降低启动门槛、维持节奏。", "tier": "D", "status": "verified", "verification": "practitioner", "source": "从业者方法（无同行评议证据）", "url": ""}, {"idx": 157, "domain": "study_skill", "slug": "spaced-repetition-tool", "title": "间隔重复软件：把复习节奏交给算法", "summary": "Anki 类工具按遗忘曲线安排复习，把「什么时候复习」这件事自动化。", "tier": "B", "status": "verified", "verification": "verified", "source": "工具+循证原理", "url": "https://en.wikipedia.org/wiki/Spaced_repetition"}, {"idx": 158, "domain": "study_skill", "slug": "sq3r", "title": "SQ3R：带着问题读教材", "summary": "浏览、提问、精读、复述、复习五步，把被动阅读变成主动提取。", "tier": "C", "status": "verified", "verification": "canonical", "source": "Harper & Row", "url": ""}, {"idx": 159, "domain": "study_skill", "slug": "time-blocking", "title": "时间块：给每件事预占一段日历", "summary": "不是列待办，而是把任务放到具体时段；能看见时间去哪了。", "tier": "D", "status": "verified", "verification": "practitioner", "source": "从业者方法", "url": ""}, {"idx": 160, "domain": "study_skill", "slug": "zettelkasten", "title": "卡片盒笔记：通过链接让知识长成网络", "summary": "把每条想法写成独立卡片并互相链接，形成可复用的思考网络。", "tier": "D", "status": "verified", "verification": "practitioner", "source": "从业者方法", "url": ""}]</script>
<script>
const ENTRIES = JSON.parse(document.getElementById('data').textContent);
const KEY = 'method-kb-review-2026-10-06';
const DECISIONS = ['通过', '改写', '下架'];
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { state = {}; }

const DOMAIN_LABEL = { psych:'心理', behavior:'行为', cognitive:'认知', study_skill:'学习技能',
  competition:'竞赛', discipline:'自律', neuro:'神经', exam:'考试', metacognitive:'元认知' };

function save() { localStorage.setItem(KEY, JSON.stringify({ savedAt: new Date().toISOString(), entries: state })); }
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 1800); }

function stats() {
  const c = { 通过:0, 改写:0, 下架:0 };
  for (const e of ENTRIES) if (c[state[e.slug]] !== undefined) c[state[e.slug]]++;
  return c;
}

function refreshHeader() {
  const c = stats();
  document.getElementById('done').textContent = c.通过 + c.改写 + c.下架;
  document.getElementById('total').textContent = ENTRIES.length;
  document.getElementById('counts').textContent = `通过 ${c.通过} · 改写 ${c.改写} · 下架 ${c.下架}`;
}

document.getElementById('list').addEventListener('click', (ev) => {
  const b = ev.target.closest('.opt'); if (!b) return;
  const slug = b.dataset.slug;
  if (state[slug] === b.dataset.v) delete state[slug]; else state[slug] = b.dataset.v;
  save(); render();
});
document.getElementById('list').addEventListener('input', (ev) => {
  if (ev.target.classList.contains('note')) { state[ev.target.dataset.slug + ':note'] = ev.target.value; save(); }
});
document.getElementById('q').addEventListener('input', render);
document.getElementById('stateFilter').addEventListener('change', render);

// 域筛选 chips
{
  const chips = document.getElementById('chips');
  const domains = [...new Set(ENTRIES.map(e => e.domain))];
  chips.innerHTML = `<span class="chip on" data-d="">全部</span>` + domains.map(d =>
    `<span class="chip" data-d="${d}">${DOMAIN_LABEL[d] || d} ${ENTRIES.filter(e => e.domain === d).length}</span>`).join('');
  chips.addEventListener('click', (ev) => {
    const c = ev.target.closest('.chip'); if (!c) return;
    chips.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === c));
    curDomain = c.dataset.d; render();
  });
}
let curDomain = '';

function render() {
    const list = document.getElementById('list');
    const q = document.getElementById('q').value.trim().toLowerCase();
    const sf = document.getElementById('stateFilter').value;
    let out = [], cur = null, shown = 0;
    for (const e of ENTRIES) {
      if (curDomain && e.domain !== curDomain) continue;
      const d = state[e.slug];
      if (q) { const hay = (e.slug + ' ' + e.title + ' ' + e.summary + ' ' + (e.source || '')).toLowerCase(); if (!hay.includes(q)) continue; }
      if (sf === 'todo' && d) continue;
      if (sf === 'contested' && e.status !== 'contested') continue;
      if (['通过','改写','下架'].includes(sf) && d !== sf) continue;
      if (cur !== e.domain) { cur = e.domain; out.push(`<div class="domain-h">${DOMAIN_LABEL[e.domain] || e.domain}</div>`); }
      const cit = e.verification ? `<span class="badge ${e.verification === 'verified' ? 'verified-cit' : e.verification}">${e.verification}</span>` : '';
      const src = e.source ? `<div class="src">引用：${e.source}${e.url ? ` · <a href="${e.url}" target="_blank" rel="noopener">${e.url}</a>` : ''}</div>` : '';
      out.push(`<div class="card ${d ? 'decided-' + ({通过:'ok',改写:'edit',下架:'del'})[d] : ''}" id="card-${e.slug}">
        <div class="meta"><span>#${e.idx}</span><span class="badge">${DOMAIN_LABEL[e.domain] || e.domain}</span>
          <span class="badge">tier ${e.tier}</span><span class="badge ${e.status === 'contested' ? 'contested' : ''}">${e.status}</span>${cit}
          <span class="badge" style="border-style:dashed">${e.slug}</span></div>
        <div class="title">${e.title}</div>
        <div class="summary">${e.summary}</div>${src}
        <div class="opts">${DECISIONS.map(v =>
          `<button class="opt${d === v ? ' on' : ''}" data-v="${v}" data-slug="${e.slug}">${v}</button>`).join('')}</div>
        <textarea class="note" data-slug="${e.slug}" placeholder="评估意见（改写/下架必填，通过可留空）">${(state[e.slug + ':note'] || '').replace(/</g, '&lt;')}</textarea>
      </div>`);
      shown++;
    }
    list.innerHTML = out.join('') || '<p style="color:var(--faint)">当前筛选没有条目。</p>';
    refreshHeader();
    document.getElementById('done').dataset.shown = shown;
}

document.getElementById('exportBtn').addEventListener('click', () => {
  const missing = ENTRIES.filter(e => !state[e.slug]);
  const c = stats();
  if (missing.length && !confirm(`还有 ${missing.length} 条未评，导出的 JSON 将不含它们。仍要导出吗？（可稍后补评再导）`)) return;
  const result = {
    exportedAt: new Date().toISOString(),
    source: 'method-kb-final-review-worksheet-2026-10-06',
    progress: { total: ENTRIES.length, decided: c.通过 + c.改写 + c.下架, ...c },
    entries: ENTRIES.filter(e => state[e.slug]).map(e => ({
      slug: e.slug, domain: e.domain, title: e.title,
      decision: state[e.slug], note: (state[e.slug + ':note'] || '').trim(),
    })),
  };
  const blob = new Blob([JSON.stringify(result, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'method-kb-review-result.json';
  a.click();
  URL.revokeObjectURL(a.href);
  toast(`已导出 ${result.entries.length} 条`);
});

document.getElementById('importFile').addEventListener('change', (ev) => {
  const f = ev.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const j = JSON.parse(r.result);
      let n = 0;
      for (const e of (j.entries || [])) {
        if (DECISIONS.includes(e.decision)) { state[e.slug] = e.decision; if (e.note) state[e.slug + ':note'] = e.note; n++; }
      }
      save(); render(); toast(`已导入 ${n} 条评审结果`);
    } catch (e) { alert('文件不是有效的评审 JSON'); }
  };
  r.readAsText(f);
  ev.target.value = '';
});

render();
</script>
</body>
</html>
